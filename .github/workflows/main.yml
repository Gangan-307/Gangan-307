name: generate animation

on:
  # 每 24 小时自动运行一次
  schedule:
    - cron: "0 */24 * * *" 
  
  # 允许手动触发运行
  workflow_dispatch:
  
  # 每次向 main 分支推送代码时触发
  push:
    branches:
      - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 生成贪吃蛇动画
      - name: generate github-contribution-grid-snake.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # 将生成的图片推送到一个独立的分支（output 分支）
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

name: Metrics
on:
  # 允许手动触发运行
  workflow_dispatch:
  # 定时任务：每天凌晨 0 点自动运行一次
  schedule:
    - cron: "0 0 * * *"
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Language Metrics
        uses: lowlighter/metrics@latest
        with:
          # 使用你在 Secrets 中配置的 Token
          token: ${{ secrets.METRICS_TOKEN }}

          # 你的 GitHub 用户名
          user: 你的GitHub用户名
          
          # 核心设置：设为空字符串 ""，表示不生成默认的大卡片，只保留下面启用的语言卡片
          base: ""
          
          # 设定输出文件名
          filename: github-metrics.svg

          # 启用语言插件
          plugin_languages: yes
          # 忽略的语言（可根据需要自行增减，用逗号隔开）
          plugin_languages_ignored: html, css, scss
          # 显示百分比和大小
          plugin_languages_details: bytes-size, percentage
          # 限制最多显示的前 8 种语言
          plugin_languages_limit: 8
          # 核心设置：开启深入分析（分析 commit 记录，而不仅是当前仓库体积，从而生成更准确的占比图）
          plugin_languages_indepth: yes
          # 统计图表展示的部分
          plugin_languages_sections: most-used
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
